<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprint 0 - Últimas mediciones</title>
</head>
<body>
  <h1>Últimas mediciones</h1>

  <h2>Ozono (O3)</h2>
  <p>Valor: <b id="valor-11">-</b> ppm</p>
  <p>Contador: <span id="contador-11">-</span> | Id: <span id="id-11">-</span> | Fecha: <span id="fecha-11">-</span></p>

  <h2>Temperatura</h2>
  <p>Valor: <b id="valor-12">-</b> °C</p>
  <p>Contador: <span id="contador-12">-</span> | Id: <span id="id-12">-</span> | Fecha: <span id="fecha-12">-</span></p>

  <p id="estado"></p>
  <button id="botonActualizar">Actualizar</button>

  <script src="LogicaFake.js"></script>
  <script>
    const laLogica = new LogicaFake()
    const TIPOS = { O3: 11, TEMPERATURA: 12 }

    // ----------------------------------------------------------
    // tipo: N, medicion: Medicion | null --> pintarMedicion()
    // ----------------------------------------------------------
    function pintarMedicion(tipo, medicion) {
      const poner = (campo, texto) => { document.getElementById(campo + "-" + tipo).textContent = texto }
      if (medicion === null) {
        poner("valor", "sin datos")
        return
      }
      poner("valor", medicion.valor)
      poner("contador", medicion.contador)
      poner("id", medicion.id)
      poner("fecha", new Date(medicion.fecha).toLocaleString())
    }

    // ----------------------------------------------------------
    // mostrarUltimasMediciones() -->
    // ----------------------------------------------------------
    async function mostrarUltimasMediciones() {
      const estado = document.getElementById("estado")
      try {
        for (const tipo of Object.values(TIPOS)) {
          pintarMedicion(tipo, await laLogica.leerUltimaMedicion(tipo))
        }
        estado.textContent = "Actualizado: " + new Date().toLocaleTimeString()
      } catch (error) {
        estado.textContent = "Error: " + error.message
      }
    }

    document.getElementById("botonActualizar").onclick = mostrarUltimasMediciones
    mostrarUltimasMediciones()
    setInterval(mostrarUltimasMediciones, 2000) // refresco automático cada 2 s
  </script>
</body>
</html>
